name: CD

# Deploys only what passed CI: runs after a successful CI run on a push to main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a deploy halfway
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Publish Docker images
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image names
        id: names
        run: |
          # Registry paths must be lowercase
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/$owner/ats-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/ats-web" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:latest
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: API_URL=http://api:5000
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:latest
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  vercel:
    name: Deploy to Vercel
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel deploy skipped: set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (see docs/DEPLOYMENT.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install --global vercel@63.1.2
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check
        if: steps.check.outputs.ready == 'true'
        env:
          # The production domain; the unique deployment URL may sit behind Vercel's deployment protection
          SITE_URL: ${{ vars.PRODUCTION_URL || steps.deploy.outputs.url }}
        run: |
          # Retries while the new deployment warms up; fails the run if the API or database is down
          for i in $(seq 1 10); do
            if curl -fsS "$SITE_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::$SITE_URL/api/health did not report healthy"
          exit 1
