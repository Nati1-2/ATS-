name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: API tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/ats_test

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [server, web]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/ats
      JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
      CLIENT_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            e2e/package-lock.json
      - run: npm ci && npm ci --prefix server && npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: Start API and web app
        run: |
          # Only the API runs in development mode (cookies over plain http); next build fails with NODE_ENV=development
          NODE_ENV=development npm run seed --prefix server
          (cd server && NODE_ENV=development node src/index.js > ../api.log 2>&1 &)
          npm run build
          (npx next start -p 3000 > web.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 120000 http://localhost:3000/api/health
      - run: npm test --prefix e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            api.log
            web.log

  docker:
    name: Production images
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml build
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-used-at-runtime-000
          CLIENT_URL: http://localhost:3000
