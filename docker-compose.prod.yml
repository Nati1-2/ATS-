# Production stack: MongoDB + API + web. Only the web app is published;
# put it behind an HTTPS reverse proxy (Caddy, Nginx, a cloud load balancer) for real use.
#
# Reads the project's single .env (set JWT_SECRET, CLIENT_URL and ADMIN_EMAIL / ADMIN_PASSWORD there):
#   docker compose -f docker-compose.prod.yml up -d --build

name: ats-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/ats
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_RESUME_MB: ${MAX_RESUME_MB:-5}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-flash}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        API_URL: http://api:5000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
