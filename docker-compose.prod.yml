# Production stack: MongoDB + API + web. Only the web app is published;
# put it behind an HTTPS reverse proxy (Caddy, Nginx, a cloud load balancer) for real use.
#
#   cp .env.production.example .env.production   # then edit it
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec api \
#     npm run create-admin -- --email you@company.com --name "Your Name" --company "Your Company"

name: ats-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/ats
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env.production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_RESUME_MB: ${MAX_RESUME_MB:-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-flash}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        API_URL: http://api:5000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
